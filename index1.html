<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insight DAEJEON · 초교 폐교 위기 예측</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>

/* ── RESET ── */
*{margin:0;padding:0;box-sizing:border-box;}

:root{
  --bg:#0a0e1a;
  --bg2:#0d1220;
  --card:#111827;
  --card2:#162032;
  --border:#1e2d4a;
  --border2:#253552;
  --text:#e2e8f0;
  --text2:#94a3b8;
  --text3:#64748b;
  --safe:#22c55e;
  --high:#f97316;
  --danger:#ef4444;
  --accent:#3b82f6;
  --accent2:#8b5cf6;
}

body{
  font-family:'Noto Sans KR',sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* ── HEADER ── */
.hdr{
  display:flex;
  align-items:center;
  gap:14px;
  padding:0 24px;
  height:54px;
  background:#060c1a;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  z-index:100;
}
.logo-box{
  width:32px;height:32px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Mono',monospace;
  font-weight:700;font-size:15px;color:#fff;
  flex-shrink:0;
}
.hdr-title{
  font-size:16px;font-weight:700;letter-spacing:-.4px;white-space:nowrap;
}
.hdr-sub{font-size:12px;font-weight:400;color:var(--text3);margin-left:2px;}
.hdr-spacer{flex:1;}
.hdr-year{
  display:flex;align-items:center;gap:6px;
  font-family:'Space Mono',monospace;font-size:11px;
  color:var(--text3);letter-spacing:1px;
}
.year-num{
  font-size:28px;font-weight:700;color:var(--accent);
  letter-spacing:-2px;line-height:1;
}

/* ── MAIN 3-PANEL LAYOUT ── */
.layout{
  flex:1;
  display:grid;
  grid-template-columns:280px 1fr 320px;
  overflow:hidden;
  min-height:0;
}

/* ── LEFT SIDEBAR ── */
.sidebar{
  display:flex;flex-direction:column;
  background:var(--bg2);
  border-right:1px solid var(--border);
  overflow:hidden;
  min-height:0;
}
.search-wrap{
  padding:12px 12px 6px;
  flex-shrink:0;
}
.search-box{
  display:flex;align-items:center;gap:8px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:8px;
  padding:8px 12px;
}
.search-icon{color:var(--text3);font-size:13px;flex-shrink:0;}
.search-input{
  flex:1;border:none;background:transparent;
  color:var(--text);font-size:13px;
  font-family:'Noto Sans KR',sans-serif;
  outline:none;
}
.search-input::placeholder{color:var(--text3);}
.search-box:focus-within{border-color:var(--accent);}

.filter-row{
  display:flex;gap:5px;
  padding:0 12px 8px;
  flex-shrink:0;
}
.filter-btn{
  flex:1;
  padding:5px 4px;
  border-radius:6px;
  border:1px solid var(--border2);
  background:var(--card);
  color:var(--text3);
  font-size:11px;font-weight:600;
  font-family:'Noto Sans KR',sans-serif;
  cursor:pointer;
  transition:all .15s;
  white-space:nowrap;
}
.filter-btn:hover{color:var(--text2);border-color:var(--border2);}
.filter-btn.on-all   {background:rgba(59,130,246,.15);border-color:var(--accent);color:var(--accent);}
.filter-btn.on-safe  {background:rgba(34,197,94,.15);border-color:var(--safe);color:var(--safe);}
.filter-btn.on-high  {background:rgba(249,115,22,.15);border-color:var(--high);color:var(--high);}
.filter-btn.on-danger{background:rgba(239,68,68,.15);border-color:var(--danger);color:var(--danger);}

.list-meta{
  display:flex;justify-content:space-between;align-items:center;
  padding:6px 16px 8px;
  font-size:11px;flex-shrink:0;
}
.list-meta-count{color:var(--text2);font-weight:600;}
.sort-toggle{display:flex;gap:4px;}
.sort-btn{
  font-size:10px;font-weight:600;padding:3px 8px;
  border-radius:5px;border:1px solid var(--border2);
  background:var(--card);color:var(--text3);
  cursor:pointer;font-family:'Noto Sans KR',sans-serif;
  transition:all .15s;
}
.sort-btn.active{background:rgba(59,130,246,.15);border-color:var(--accent);color:var(--accent);}
.sort-btn:hover:not(.active){color:var(--text2);}

.school-list{
  flex:1;overflow-y:auto;
  padding:0 8px 8px;
}
.school-list::-webkit-scrollbar{width:4px;}
.school-list::-webkit-scrollbar-track{background:transparent;}
.school-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

.school-card{
  padding:10px 12px;
  border-radius:8px;
  border:1px solid transparent;
  cursor:pointer;
  margin-bottom:5px;
  background:var(--card);
  transition:border-color .15s,background .15s;
}
.school-card:hover{border-color:var(--border2);background:var(--card2);}
.school-card.active{
  border-color:var(--accent);
  background:rgba(59,130,246,.08);
}
.card-top{
  display:flex;align-items:center;
  justify-content:space-between;gap:8px;
  margin-bottom:3px;
}
.card-name{
  font-size:13px;font-weight:600;letter-spacing:-.3px;
  flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.card-sub{font-size:11px;color:var(--text3);}

/* ── 등급 배지 ── */
.grade-badge{
  font-size:10px;font-weight:700;
  padding:2px 8px;border-radius:4px;
  white-space:nowrap;flex-shrink:0;
  font-family:'Space Mono',monospace;letter-spacing:.3px;
}
.badge-safe{background:rgba(34,197,94,.12);color:var(--safe);border:1px solid rgba(34,197,94,.25);}
.badge-high{background:rgba(249,115,22,.12);color:var(--high);border:1px solid rgba(249,115,22,.25);}
.badge-danger{background:rgba(239,68,68,.12);color:var(--danger);border:1px solid rgba(239,68,68,.25);}

/* ── MAP CENTER ── */
.map-wrap{position:relative;overflow:hidden;}
#map{width:100%;height:100%;}

.risk-legend{
  position:absolute;top:14px;left:14px;z-index:900;
  background:rgba(255,255,255,.97);
  border-radius:10px;
  padding:12px 16px;
  box-shadow:0 2px 16px rgba(0,0,0,.15);
  pointer-events:none;
  min-width:180px;
}
.legend-title{
  font-size:10px;font-weight:700;color:#374151;
  letter-spacing:.8px;text-transform:uppercase;
  margin-bottom:9px;
}
.legend-row{
  display:flex;align-items:flex-start;gap:8px;
  margin-bottom:7px;
}
.legend-row:last-child{margin-bottom:0;}
.legend-icon{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;border:2px solid rgba(255,255,255,.8);}
.legend-text{}
.legend-name{font-size:12px;font-weight:700;color:#111827;line-height:1.2;}
.legend-desc{font-size:10px;color:#6b7280;margin-top:1px;}
.legend-divider{border:none;border-top:1px solid #e5e7eb;margin:8px 0;}
.legend-fac-row{display:flex;align-items:center;gap:7px;margin-bottom:5px;font-size:11px;color:#374151;}
.legend-fac-row:last-child{margin-bottom:0;}
.legend-fac-icon{font-size:14px;width:20px;text-align:center;}

/* ── RIGHT DETAIL PANEL ── */
.detail-panel{
  background:var(--bg2);
  border-left:1px solid var(--border);
  display:flex;flex-direction:column;
  overflow-y:auto;
  min-height:0;
}
.detail-panel::-webkit-scrollbar{width:4px;}
.detail-panel::-webkit-scrollbar-track{background:transparent;}
.detail-panel::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

.detail-empty{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  color:var(--text3);gap:10px;padding:24px;
}
.empty-icon{font-size:36px;opacity:.35;}
.empty-text{font-size:13px;letter-spacing:-.2px;text-align:center;line-height:1.6;}

.detail-hdr{
  padding:16px 18px 14px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.detail-label{
  font-size:9px;font-weight:700;color:var(--accent);
  letter-spacing:1.2px;text-transform:uppercase;
  margin-bottom:8px;
}
.detail-name{
  font-size:17px;font-weight:700;letter-spacing:-.5px;
  margin-bottom:3px;line-height:1.3;
}
.detail-dong{font-size:11px;color:var(--text3);margin-bottom:10px;}
.detail-grade-large{
  font-size:12px;font-weight:700;
  padding:5px 14px;border-radius:6px;
  display:inline-block;
}

.detail-section{
  padding:14px 18px;
  border-bottom:1px solid var(--border);
}
.detail-section:last-child{border-bottom:none;}
.detail-section-title{
  font-size:9px;font-weight:700;color:var(--text3);
  text-transform:uppercase;letter-spacing:1px;
  margin-bottom:10px;
}

/* 신입생 추이 차트 */
.enroll-chart-wrap{position:relative;height:140px;}

/* 시설부담지수 */
.fac-row{margin-bottom:10px;}
.fac-row:last-child{margin-bottom:0;}
.fac-label-row{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:5px;
}
.fac-name{font-size:11px;color:var(--text2);}
.fac-val{
  font-size:11px;font-weight:700;
  font-family:'Space Mono',monospace;
}
.fac-bar-bg{
  background:var(--border);border-radius:3px;
  height:4px;overflow:hidden;
}
.fac-bar-fill{
  height:100%;border-radius:3px;
  transition:width .5s ease;
}

.detail-info-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
  margin-top:2px;
}
.detail-info-cell{
  background:var(--card);border:1px solid var(--border);
  border-radius:7px;padding:9px 12px;
}
.info-label{font-size:10px;color:var(--text3);margin-bottom:4px;}
.info-val{font-size:15px;font-weight:700;font-family:'Space Mono',monospace;letter-spacing:-.5px;}

.warning-box{
  margin:12px 18px 0;
  background:rgba(239,68,68,.06);
  border:1px solid rgba(239,68,68,.2);
  border-radius:8px;padding:9px 12px;
  font-size:11px;color:var(--danger);line-height:1.5;
}
.warning-box.high-warn{
  background:rgba(249,115,22,.06);
  border-color:rgba(249,115,22,.2);
  color:var(--high);
}

/* ── BOTTOM TIMELINE ── */
.timeline{
  height:62px;flex-shrink:0;
  background:var(--card);
  border-top:1px solid var(--border);
  display:flex;align-items:center;gap:16px;
  padding:0 20px;
}
.play-btn{
  width:36px;height:36px;
  background:var(--accent);
  border:none;border-radius:50%;
  color:#fff;font-size:13px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  transition:background .15s;
}
.play-btn:hover{background:#2563eb;}
.play-btn.playing{background:#ef4444;}
.play-btn.playing:hover{background:#dc2626;}

.slider-wrap{flex:1;position:relative;}
.year-slider{
  width:100%;
  -webkit-appearance:none;appearance:none;
  height:4px;
  background:var(--border);
  border-radius:2px;outline:none;cursor:pointer;
}
.year-slider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:16px;height:16px;
  background:var(--accent);
  border-radius:50%;border:2px solid #fff;
  cursor:pointer;
  box-shadow:0 0 0 3px rgba(59,130,246,.25);
}
.slider-ticks{
  display:flex;justify-content:space-between;
  padding:0 2px;margin-top:5px;
}
.slider-ticks span{
  font-size:9px;color:var(--text3);
  font-family:'Space Mono',monospace;
}

.closure-stat{
  font-size:9px;color:var(--text3);
  letter-spacing:.5px;text-align:right;
  white-space:nowrap;line-height:1.4;
  text-transform:uppercase;
}
.closure-num{
  font-size:24px;font-weight:900;
  font-family:'Space Mono',monospace;
  color:var(--danger);letter-spacing:-1px;
  display:block;margin-top:1px;
}

/* ── TABS ── */
.tab-nav{
  display:flex;gap:3px;
  background:rgba(255,255,255,.05);
  border-radius:8px;padding:3px;
}
.tab-btn{
  padding:5px 22px;border-radius:6px;border:none;
  background:transparent;color:var(--text3);
  font-size:13px;font-weight:600;font-family:'Noto Sans KR',sans-serif;
  cursor:pointer;transition:all .15s;white-space:nowrap;
}
.tab-btn.active{background:var(--accent);color:#fff;}
.tab-btn:hover:not(.active){background:rgba(255,255,255,.07);color:var(--text2);}

/* ── PAGE WRAPPERS ── */
.page{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;}

/* ── STATS PAGE ── */
.stats-wrap{
  flex:1;overflow-y:auto;
  padding:24px 28px;
  display:flex;flex-direction:column;gap:18px;
  min-height:0;
}
.stats-wrap::-webkit-scrollbar{width:4px;}
.stats-wrap::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

/* 2x2 stat grid */
.stats-top-row{display:flex;gap:14px;flex:1;min-height:0;}
.stat-grid-2x2{
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:12px;
  flex:1.35;min-width:0;
}
.stat-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:24px 28px 20px;
  position:relative;overflow:hidden;
  transition:border-color .2s;
}
.stat-card:hover{border-color:var(--border2);}
.stat-card::before{
  content:'';position:absolute;top:0;left:0;right:0;
  height:3px;border-radius:12px 12px 0 0;
}
.stat-card.sc-danger::before{background:var(--danger);}
.stat-card.sc-high::before  {background:var(--high);}
.stat-card.sc-safe::before  {background:var(--safe);}
.stat-card.sc-total::before {background:var(--accent);}
.stat-label{
  font-size:11px;font-weight:700;color:var(--text3);
  letter-spacing:.6px;text-transform:uppercase;margin-bottom:12px;
}
.stat-num{
  font-size:56px;font-weight:900;
  font-family:'Space Mono',monospace;
  letter-spacing:-3px;line-height:1;
}
.stat-card.sc-danger .stat-num{color:var(--danger);}
.stat-card.sc-high   .stat-num{color:var(--high);}
.stat-card.sc-safe   .stat-num{color:var(--safe);}
.stat-card.sc-total  .stat-num{color:var(--accent);}
.stat-sub{font-size:11px;color:var(--text3);margin-top:10px;}

/* chart cards */
.chart-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px 20px;
  display:flex;flex-direction:column;
}
.chart-card.hist-card{flex:1;min-height:0;}
.chart-card.trend-row{flex-shrink:0;height:210px;}
.chart-card-title{
  font-size:11px;font-weight:700;color:var(--text2);
  letter-spacing:-.2px;margin-bottom:12px;flex-shrink:0;
}
.chart-canvas-wrap{flex:1;position:relative;min-height:0;}


/* ─────────────────────────────────────────────────────────────
   DAEJEON COMBINED VIEW
   UI foundation is copied from dashboard.html; these rules only
   compose the original components into the one-page final layout.
───────────────────────────────────────────────────────────── */
.combined-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;}
.stats-strip{
  display:flex;gap:10px;padding:8px 14px;height:188px;flex-shrink:0;
  border-bottom:1px solid var(--border);
}
.stats-strip .stat-grid-2x2{
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
  gap:8px;flex:1.05;min-width:0;
}
.stats-strip .stat-card{
  padding:8px 14px 6px;border-radius:10px;
}
.stats-strip .stat-label{
  font-size:10px;font-weight:700;color:var(--text);letter-spacing:.5px;
  text-transform:uppercase;margin-bottom:5px;
}
.stats-strip .stat-num{font-size:34px;letter-spacing:-2px;line-height:1;}
.stats-strip .chart-card{
  border-radius:10px;padding:12px 16px;display:flex;flex-direction:column;
  flex:1.08;min-width:0;min-height:0;
}
.stats-strip .chart-card-title{
  color:var(--text);font-size:11px;margin-bottom:10px;
}
.stats-strip .chart-canvas-wrap{flex:1;position:relative;min-height:0;}
.combined-wrap > .layout{flex:1;min-height:0;}
.timeline{position:relative;z-index:1100;}
.slider-ticks span{font-size:12px;font-weight:700;color:var(--text);}
.closure-stat{font-weight:600;color:var(--text);}

/* selected school contextual layers */
.layer-chip-wrap{position:absolute;right:12px;top:12px;z-index:900;display:flex;gap:5px;pointer-events:auto;}
.layer-chip{font-family:'Noto Sans KR',sans-serif;font-size:9px;font-weight:700;border:1px solid rgba(30,45,74,.9);background:rgba(6,12,26,.90);color:#cbd5e1;border-radius:6px;padding:5px 8px;cursor:pointer;}
.layer-chip.on{border-color:var(--accent);color:#93c5fd;background:rgba(59,130,246,.15);}

/* utilization result placeholder */
.reuse-placeholder{font-size:11px;line-height:1.65;color:var(--text3);padding:10px 12px;border:1px dashed var(--border2);border-radius:7px;background:rgba(59,130,246,.04);}
.zone-name-list{display:flex;flex-wrap:wrap;gap:5px;}
.zone-name-chip{font-size:9px;color:#93c5fd;background:rgba(59,130,246,.10);border:1px solid rgba(59,130,246,.24);padding:3px 7px;border-radius:5px;}

/* Leaflet compact controls, same visual density as the final prototype */
.leaflet-control-zoom a{width:24px!important;height:24px!important;line-height:24px!important;font-size:14px!important;}
.leaflet-control-zoom{margin-bottom:12px!important;margin-left:8px!important;}
.risk-legend{padding:6px 10px;min-width:110px;}
.legend-title{font-size:8px;margin-bottom:4px;}
.legend-row{margin-bottom:4px;gap:5px;}
.legend-icon{width:14px;height:14px;font-size:8px;}
.legend-name{font-size:10px;}
.legend-desc{font-size:8px;}
.legend-divider{margin:5px 0;}
.legend-fac-row{font-size:9px;margin-bottom:2px;gap:4px;}
.legend-fac-icon{font-size:10px;width:13px;}

/* responsive guard */
@media(max-width:1350px){
  .layout{grid-template-columns:250px 1fr 300px;}
  .stats-strip{height:174px;}
  .stats-strip .stat-num{font-size:30px;}
}

.prediction-excluded-box{height:140px;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;border:1px dashed var(--border2);border-radius:8px;background:rgba(239,68,68,.035);color:var(--text3);font-size:11px;line-height:1.6;}


/* Prevent SVG/Leaflet vector focus bounding boxes while panning/dragging. */
.leaflet-container .leaflet-interactive,
.leaflet-container .leaflet-interactive:focus,
.leaflet-container svg,
.leaflet-container svg:focus,
.leaflet-container path:focus {
  outline:none !important;
}
.leaflet-container * { -webkit-tap-highlight-color: transparent; }

.warning-box.safe-info{
  background:rgba(34,197,94,.06);
  border-color:rgba(34,197,94,.24);
  color:var(--safe);
}
.prediction-excluded-box.safe-excluded{
  background:rgba(34,197,94,.035);
  border-color:rgba(34,197,94,.24);
}

/* ── 행정동 시설 부족지수 / 우선 활용방향 ───────────────────────────── */
.shortage-meta{
  font-size:10px;color:var(--text2);line-height:1.55;
  padding:8px 10px;margin-bottom:10px;
  background:rgba(59,130,246,.045);border:1px solid rgba(59,130,246,.14);border-radius:7px;
}
.shortage-meta b{color:var(--text);font-weight:700;}
.shortage-meta span{color:#93c5fd;}
.shortage-meta-note{font-size:9px;color:var(--text3);margin-top:3px;}
.shortage-list{display:flex;flex-direction:column;gap:10px;}
.shortage-row{padding:8px 9px;border-radius:7px;border:1px solid transparent;background:rgba(255,255,255,.012);}
.shortage-row.top-shortage{border-color:rgba(59,130,246,.22);background:rgba(59,130,246,.035);}
.shortage-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;}
.shortage-name-wrap{display:flex;align-items:center;gap:5px;min-width:0;}

      dangerLock = {fromIdx:first, toIdx:last, fromYear:YEARS[first], toYear:YEARS[last], occurrences:rawDangerIdxs.length};
    }

    const dangerIdx = effectiveGrades.findIndex(g => g === '폐교위험');
    const highIdx = effectiveGrades.findIndex(g => g === '고위험');
    schoolMap[s.id] = {
      ...s,
      predictionExcluded,
      forcedGrade,
      forcedDanger,
      forcedSafe,
      rawGrades,
      effectiveGrades,
      dangerLock,
      dangerYr: dangerIdx >= 0 ? YEARS[dangerIdx] : null,
      highYr: highIdx >= 0 ? YEARS[highIdx] : null,
      dong: s.zoneNames?.join(', ') || '',
      dongNm: s.adminFull || '',
      minStudents: predictionExcluded ? null : s.minPred,
      minStudentYr: predictionExcluded ? null : s.minYear,
    };
  });

  const DONG_GEO = {};
  (ADMIN_GJ?.features || []).forEach(f => {
    const nm = f.properties?.adm_nm;
    if (!nm) return;
    if (!DONG_GEO[nm]) DONG_GEO[nm] = [];
    DONG_GEO[nm].push(f.geometry);
  });

  let currentYearIdx = Math.max(0, YEARS.indexOf(DATA.meta.initialYear));
  let currentYear = YEARS[currentYearIdx];
  let selectedId = null;
  let activeGrades = new Set();
  let sortOrder = 'desc';
  let isPlaying = false;
  let playTimer = null;
  let enrollChart = null;
  let histChartInst = null;
  let trendChartInst = null;

  let leafMap = null;
  const mapMarkers = {};
  let adminLayer = null;
  let hakgudoLayer = null;
  let facilityLayer = null;
  // 기본 경계는 행정동입니다. 학구도는 사용자가 필요할 때 선택해 겹쳐 볼 수 있습니다.
  let layerVisible = {admin:true, hakgudo:false, facility:true};
  let facilityMarkerKeys = new Set();
  let pendingScripts = [];

  const MOBILE_MQ = window.matchMedia('(max-width: 820px)');
  function isMobileView() { return MOBILE_MQ.matches; }

  window.setMobileView = function(view) {
    if (!['map','list','stats','detail'].includes(view)) return;
    document.body.dataset.mobileView = view;
    document.querySelectorAll('.mobile-nav-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.mobileView === view);
    });
    if (view === 'map') setTimeout(() => leafMap && leafMap.invalidateSize(), 60);
    if (view === 'stats') setTimeout(() => { histChartInst?.resize(); trendChartInst?.resize(); }, 60);
    if (view === 'detail') setTimeout(() => enrollChart?.resize(), 60);
  };

  function syncResponsiveMode() {
    if (isMobileView()) {
      const current = document.body.dataset.mobileView || 'map';
      window.setMobileView(current);
    } else {
      setTimeout(() => leafMap && leafMap.invalidateSize(), 60);
    }
  }

  function valueAt(sch, year) {
    if (sch?.predictionExcluded) return null;
    const idx = YEARS.indexOf(year);
    const v = idx >= 0 ? sch.preds?.[idx] : null;
    return v == null ? null : Number(v);
  }

  function getGrade(id, year) {
    const sch = schoolMap[id];
    const idx = YEARS.indexOf(year);
    if (!sch || idx < 0) return '안전';
    return sch.effectiveGrades?.[idx] || '안전';
  }

  function formatNum(v) {
    if (v == null || Number.isNaN(Number(v))) return '—';
    return Number(v).toLocaleString('ko-KR', {maximumFractionDigits:1});
  }

  function countsForYear(year) {
    const c = {'폐교위험':0,'고위험':0,'안전':0};
    Object.keys(schoolMap).forEach(id => c[getGrade(id, year)]++);
    return c;
  }

  const dangerCounts = YEARS.map(y => countsForYear(y)['폐교위험']);
  const highCounts = YEARS.map(y => countsForYear(y)['고위험']);

  function schoolIcon(grade, selected) {
    const color = GRADE_COLOR[grade];
    const size = selected ? 34 : 26;
    return L.divIcon({
      className:'',
      html:`<div style="background:${color};width:${size}px;height:${size}px;border-radius:50%;border:2.5px solid rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;font-size:${selected?16:13}px;box-shadow:0 2px 8px rgba(0,0,0,.35);cursor:pointer;">🏫</div>`,
      iconSize:[size,size], iconAnchor:[size/2,size/2]
    });
  }

  function hiddenIcon() {
    return L.divIcon({className:'',html:'',iconSize:[0,0]});
  }

  function selectedZoneIds() {
    if (!selectedId) return new Set();
    return new Set((schoolMap[selectedId].zoneIds || []).map(String));
  }

  function zoneStyle(feature) {
    const selected = selectedZoneIds().has(String(feature.properties?.HAKGUDO_ID));
    return {
      color: selected ? '#f59e0b' : '#38bdf8',
      weight: selected ? 3 : 0.8,
      opacity: selected ? 0.95 : 0.35,
      fillColor: selected ? '#f59e0b' : '#38bdf8',
      fillOpacity: selected ? 0.08 : 0.0,
      dashArray: selected ? null : '4,4'
    };
  }

  function adminStyle(feature) {
    const sch = selectedId ? schoolMap[selectedId] : null;
    const featureCode = String(feature.properties?.adm_cd2 ?? '');
    const featureName = String(feature.properties?.adm_nm ?? '');
    const selected = !!sch && (
      (sch.adminCode && String(sch.adminCode) === featureCode) ||
      (sch.adminFull && String(sch.adminFull) === featureName)
    );
    return {
      color: selected ? '#f59e0b' : '#475569',
      weight: selected ? 3 : 1.15,
      opacity: selected ? 1 : 0.78,
      fillColor: selected ? '#f59e0b' : '#64748b',
      fillOpacity: selected ? 0.10 : 0.025,
      dashArray: selected ? null : null
    };
  }


  function initMap() {
    const daejeonBounds = L.latLngBounds([36.10,127.10],[36.55,127.60]);
    leafMap = L.map('map', {
      center:[36.3505,127.3848], zoom:11, minZoom:10,
      maxBounds:daejeonBounds, maxBoundsViscosity:0.7, zoomControl:true
    });

    let baseLayer;
    if (VWORLD_KEY) {
      baseLayer = L.tileLayer(`https://api.vworld.kr/req/wmts/1.0.0/${VWORLD_KEY}/Base/{z}/{y}/{x}.png`, {
        attribution:'© 국토지리정보원', maxZoom:18, tileSize:256
      });
      let tileErrors = 0;
      baseLayer.on('tileerror', () => {
        tileErrors += 1;
        if (tileErrors === 4) {
          try { leafMap.removeLayer(baseLayer); } catch(e) {}
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom:19, attribution:'© OpenStreetMap contributors'
          }).addTo(leafMap);
        }
      });
    } else {
      baseLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom:19, attribution:'© OpenStreetMap contributors'
      });
    }
    baseLayer.addTo(leafMap);

    adminLayer = L.geoJSON(ADMIN_GJ, {
      style:adminStyle,
      interactive:false
    }).addTo(leafMap);

    hakgudoLayer = L.geoJSON(HAKGUDO_GJ, {
      style:zoneStyle,
      interactive:false
    });

    facilityLayer = L.layerGroup().addTo(leafMap);

    Object.values(schoolMap).forEach(sch => {
      if (!sch.lat || !sch.lng) return;
      const m = L.marker([sch.lat,sch.lng],{icon:schoolIcon('안전',false)}).addTo(leafMap);
      m.on('click',() => selectSchool(sch.id));
      mapMarkers[sch.id] = m;
    });

    const b = adminLayer.getBounds();
    if (b.isValid()) leafMap.fitBounds(b.pad(0.02));
  }

  function updateMarkers(year) {
    Object.entries(mapMarkers).forEach(([id,m]) => {
      const grade = getGrade(id, year);
      const selected = id === selectedId;
      const visible = activeGrades.size === 0 || activeGrades.has(grade);
      m.setIcon(visible ? schoolIcon(grade, selected) : hiddenIcon());
      m.setZIndexOffset(visible && grade !== '안전' ? 500 : 0);
    });
    if (adminLayer) adminLayer.setStyle(adminStyle);
    if (hakgudoLayer) hakgudoLayer.setStyle(zoneStyle);
  }

  window.setSort = function(order) {
    sortOrder = order;
    document.getElementById('sortDesc').classList.toggle('active', order === 'desc');
    document.getElementById('sortAsc').classList.toggle('active', order === 'asc');
    renderList(currentYear, document.getElementById('searchInput').value);
  };

  function syncFilterBtns() {
    const isAll = activeGrades.size === 0;
    Object.entries(FILTER_BTN).forEach(([g,id]) => {
      const btn = document.getElementById(id);
      const active = g === 'all' ? isAll : activeGrades.has(g);
      btn.className = 'filter-btn' + (active ? ' ' + FILTER_CLS[g] : '');
    });
  }

  window.toggleFilter = function(grade) {
    if (grade === 'all') activeGrades.clear();
    else if (activeGrades.has(grade)) activeGrades.delete(grade);
    else activeGrades.add(grade);
    syncFilterBtns();
    renderList(currentYear, document.getElementById('searchInput').value);
    updateMarkers(currentYear);
  };

  function renderList(year, query) {
    const q = (query || '').trim().toLowerCase();
    const root = document.getElementById('schoolList');
    let schools = Object.values(schoolMap).map(sch => ({...sch,grade:getGrade(sch.id,year)}));

    if (activeGrades.size > 0) schools = schools.filter(s => activeGrades.has(s.grade));
    if (q) {
      schools = schools.filter(s =>
        s.name.toLowerCase().includes(q) ||
        (s.dongNm || '').toLowerCase().includes(q) ||
        (s.district || '').toLowerCase().includes(q) ||
        (s.dong || '').toLowerCase().includes(q)
      );
    }

    schools.sort((a,b) => {
      const diff = sortOrder === 'desc'
        ? GRADE_ORDER[a.grade] - GRADE_ORDER[b.grade]
        : GRADE_ORDER[b.grade] - GRADE_ORDER[a.grade];
      return diff !== 0 ? diff : a.name.localeCompare(b.name,'ko');
    });

    const riskCnt = schools.filter(s => s.grade !== '안전').length;
    document.getElementById('riskCount').textContent = `${riskCnt} 학교 위험 감지`;

    root.innerHTML = schools.map(s => `
      <div class="school-card${s.id === selectedId ? ' active' : ''}" onclick="selectSchool('${s.id}')">
        <div class="card-top">
          <span class="card-name">${s.name}</span>
          <span class="grade-badge ${GRADE_BADGE[s.grade]}">${s.grade}</span>
        </div>
        <div class="card-sub">${(s.dongNm || '').replace('대전광역시 ','')}</div>
      </div>`).join('');
  }

  const SHORTAGE_KEYS = [
    {key:'어린이', emoji:'👶', color:'#3b82f6'},
    {key:'청소년', emoji:'🧒', color:'#f97316'},
    {key:'장애인', emoji:'♿', color:'#ef4444'},
    {key:'노인', emoji:'👴', color:'#22c55e'},
  ];

  function formatSupply(v) {
    if (v == null || Number.isNaN(Number(v))) return '—';
    const n = Number(v);
    return Number.isInteger(n) ? String(n) : n.toFixed(1);
  }

  function buildFacilityShortageHtml(sch) {
    if (sch.forcedSafe) {
      return `
        <div class="detail-section">
          <div class="detail-section-title">행정동 시설 부족지수</div>
          <div class="shortage-empty safe-shortage-empty">
            <b>시설부족지수 활용 대상에서 제외</b><br>
            이 학교는 인구 추계를 반영하지 않고 안전으로 고정한 학교이므로 폐교 활용 우선순위 판단에 시설부족지수를 적용하지 않습니다.
          </div>
        </div>`;
    }

    const rec = SHORTAGE_BY_SCHOOL[sch.id];
    if (!rec) {
      return `
        <div class="detail-section">
          <div class="detail-section-title">행정동 시설 부족지수</div>
          <div class="shortage-empty">
            시설부족지수 산정 대상에 포함되지 않은 학교입니다.<br>
            <small>산정대상: 2025–2032년 중 예상 신입생 17명 이하 연도가 1회 이상인 학교</small>
          </div>
        </div>`;
    }

    const values = SHORTAGE_KEYS
      .map(k => Number(rec.categories?.[k.key]?.index))
      .filter(Number.isFinite);
    const maxIndex = values.length ? Math.max(...values) : 1;
    const scaleMax = Math.max(2, Math.ceil((maxIndex * 1.08) * 10) / 10);
    const benchmark = Number(SHORTAGE_DATA.meta?.benchmark || 1);
    const benchmarkPct = Math.max(0, Math.min(100, benchmark / scaleMax * 100));

    const rows = SHORTAGE_KEYS.map(k => {
      const c = rec.categories?.[k.key] || {};
      const idx = Number(c.index || 0);
      const pct = Math.max(0, Math.min(100, idx / scaleMax * 100));
      const above = idx > benchmark;
      return `
        <div class="shortage-row${rec.highestTarget === k.key ? ' top-shortage' : ''}">
          <div class="shortage-head">
            <div class="shortage-name-wrap">
              <span class="shortage-emoji">${k.emoji}</span>
              <span class="shortage-name">${k.key}</span>
              ${rec.highestTarget === k.key ? '<span class="shortage-top-badge">최고 부족</span>' : ''}
            </div>
            <div class="shortage-index" style="color:${k.color}">${Number.isFinite(idx) ? idx.toFixed(3) : '—'}</div>
          </div>
          <div class="shortage-sub">
            <span>수요 ${c.demand == null ? '—' : Number(c.demand).toLocaleString('ko-KR')}명</span>
            <span>시설 ${formatSupply(c.supply)}개소</span>
            <span class="${above ? 'above-avg' : 'below-avg'}">${above ? '대전 평균 초과' : '대전 평균 이하'}</span>
          </div>
          <div class="shortage-bar-bg">
            <div class="shortage-benchmark" style="left:${benchmarkPct}%" title="대전 평균 1.00"></div>
            <div class="shortage-bar-fill" style="width:${pct}%;background:${k.color}"></div>
          </div>
        </div>`;
    }).join('');

    return `
      <div class="detail-section">
        <div class="detail-section-title">행정동 시설 부족지수</div>
        <div class="shortage-meta">
          <b>${rec.district} ${rec.adminDong}</b> 기준 · <span>1.00 = 대전 평균</span>
          <div class="shortage-meta-note">1보다 크면 해당 대상군의 시설 부담이 대전 평균보다 큽니다. 다문화는 산정에서 제외합니다.</div>
        </div>
        <div class="shortage-list">${rows}</div>
      </div>
      <div class="detail-section">
        <div class="detail-section-title">시설 부족 기반 우선 활용방향</div>
        <div class="priority-use-card">
          <div class="priority-use-kicker">PRIORITY USE</div>
          <div class="priority-use-title">${rec.priorityUse || '—'}</div>
          <div class="priority-use-desc">
            최고 부족 대상 <b>${rec.highestTarget || '—'}</b> · 부족지수 <b>${rec.highestIndex == null ? '—' : Number(rec.highestIndex).toFixed(3)}</b>
          </div>
        </div>
      </div>`;
  }

  function buildWarnHtml(grade, sch, year) {
    if (sch.forcedDanger) {
      return `<div class="warning-box">⚠ 인구예측 미반영 대상 · 전체 분석기간을 폐교위험으로 고정</div>`;
    }
    if (sch.forcedSafe) {
      return `<div class="warning-box safe-info">✓ 인구예측 미반영 대상 · 전체 분석기간을 안전으로 고정</div>`;
    }
    const idx = YEARS.indexOf(year);
    if (grade === '폐교위험' && sch.dangerLock && idx >= sch.dangerLock.fromIdx && idx <= sch.dangerLock.toIdx) {
      return `<div class="warning-box">⚠ 폐교위험 등급이 ${sch.dangerLock.occurrences}회 발생하여 ${sch.dangerLock.fromYear}–${sch.dangerLock.toYear}년 구간을 폐교위험으로 고정</div>`;
    }
    if (grade === '폐교위험') {
      return `<div class="warning-box">⚠ ${year}년 폐교위험 기준 충족</div>`;
    }
    if (grade === '고위험') {
      return `<div class="warning-box high-warn">⚠ ${year}년 고위험 기준 충족</div>`;
    }
    return '';
  }

  function renderDetail(id, year) {

    const grade = getGrade(id,year);
    const gradeHex = GRADE_COLOR[grade];
    const panel = document.getElementById('detailPanel');
    const zoneHtml = (sch.zoneNames || []).map(n => `<span class="zone-name-chip">${n}</span>`).join('') || '<span class="zone-name-chip">매칭 통학구역 없음</span>';

    panel.innerHTML = `
      <div class="detail-hdr">
        <div class="detail-label">School Detail</div>
        <div class="detail-name">${sch.name}</div>
        <div class="detail-dong">${(sch.dongNm || '').replace('대전광역시 ','')}</div>
        <span class="grade-badge detail-grade-large ${GRADE_BADGE[grade]}">${grade}</span>
      </div>
      <div id="detailWarningWrap">${buildWarnHtml(grade,sch,year)}</div>
      <div class="detail-section">
        <div class="detail-section-title">핵심 지표</div>
        <div class="detail-info-grid" style="grid-template-columns:repeat(3,1fr);">
          <div class="detail-info-cell" style="background:${gradeHex}22;border-color:${gradeHex}55;">
            <div class="info-label">위험 등급</div>
            <div id="detailGradeLabel" style="font-size:12px;font-weight:700;color:${gradeHex};margin-top:4px;white-space:nowrap;">${grade}</div>
          </div>
          <div class="detail-info-cell">
            <div class="info-label">현재 연도 예측</div>
            <div id="detailCurrentPred" class="info-val" style="font-size:13px;">${sch.predictionExcluded ? '미반영' : formatNum(valueAt(sch,year)) + '<small style="font-size:9px;font-weight:400"> 명</small>'}</div>
          </div>
          <div class="detail-info-cell">
            <div class="info-label">최소 예측</div>
            <div class="info-val" style="font-size:13px;color:var(--danger);">${sch.predictionExcluded ? '미반영' : formatNum(sch.minStudents) + '<small style="font-size:9px;font-weight:400"> 명</small>'}</div>
          </div>
        </div>
      </div>
      <div class="detail-section">
        <div class="detail-section-title">신입생 예측 추이 (${YEARS[0]}–${YEARS[YEARS.length-1]})</div>
        ${sch.predictionExcluded ? `<div class="prediction-excluded-box ${sch.forcedSafe ? 'safe-excluded' : ''}">이 학교는 인구예측값을 위험등급 판단에 사용하지 않습니다.<br><b>${sch.forcedSafe ? '안전 고정' : '폐교위험 고정'}</b> 대상입니다.</div>` : '<div class="enroll-chart-wrap"><canvas id="enrollCanvas"></canvas></div>'}
        <div class="detail-info-grid">
          <div class="detail-info-cell"><div class="info-label">최소 예측 연도</div><div class="info-val">${sch.predictionExcluded ? '—' : (sch.minStudentYr || '—')}</div></div>
          <div class="detail-info-cell"><div class="info-label">교육지원청</div><div class="info-val" style="font-family:'Noto Sans KR';font-size:10px;line-height:1.4;">${sch.supportOffice || '—'}</div></div>
        </div>
      </div>
      <div class="detail-section">
        <div class="detail-section-title">학구도(통학구역)</div>
        <div class="zone-name-list">${zoneHtml}</div>
      </div>
      ${buildFacilityShortageHtml(sch)}`;

    if (enrollChart) { enrollChart.destroy(); enrollChart = null; }
    if (sch.predictionExcluded) return;
    const ctx = document.getElementById('enrollCanvas').getContext('2d');
    const preds = (sch.preds || []).map(v => v == null ? null : +Number(v).toFixed(1));
    const ptColors = YEARS.map(y => y === year ? '#f59e0b' : '#3b82f6');
    const ptSizes = YEARS.map(y => y === year ? 6 : 3);

    enrollChart = new Chart(ctx, {
      type:'line',
      data:{
        labels:YEARS.map(String),
        datasets:[
          {data:preds,borderColor:'#3b82f6',backgroundColor:'rgba(59,130,246,.07)',borderWidth:2,pointBackgroundColor:ptColors,pointRadius:ptSizes,fill:true,tension:.35,spanGaps:true,order:1},
          {data:new Array(YEARS.length).fill(RISK.dangerMax),borderColor:'#ef4444',borderWidth:1.5,borderDash:[5,4],pointRadius:0,fill:false,order:2},
          {data:new Array(YEARS.length).fill(RISK.highMax),borderColor:'#f97316',borderWidth:1.5,borderDash:[5,4],pointRadius:0,fill:false,order:3},
        ]
      },
      options:{
        animation:false,responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{backgroundColor:'#1e2d4a',titleColor:'#94a3b8',bodyColor:'#e2e8f0',padding:8,filter:item=>item.datasetIndex===0,callbacks:{label:ctx=>`신입생 ${ctx.parsed.y ?? '—'}명`}}},
        scales:{x:{grid:{color:'rgba(30,45,74,.8)'},ticks:{color:'#64748b',font:{size:10}}},y:{grid:{color:'rgba(30,45,74,.8)'},ticks:{color:'#64748b',font:{size:10}},beginAtZero:true}}
      }
    });
  }

  function updateDetailYear(year) {
    if (!selectedId) return;
    const sch = schoolMap[selectedId];
    const grade = getGrade(selectedId,year);
    if (enrollChart) {
      enrollChart.data.datasets[0].pointBackgroundColor = YEARS.map(y => y === year ? '#f59e0b' : '#3b82f6');
      enrollChart.data.datasets[0].pointRadius = YEARS.map(y => y === year ? 6 : 3);
      enrollChart.update('none');
    }
    const gradeHex = GRADE_COLOR[grade];
    const gradeLabel = document.getElementById('detailGradeLabel');
    if (gradeLabel) {
      gradeLabel.textContent = grade;
      gradeLabel.style.color = gradeHex;
      const cell = gradeLabel.parentElement;
      cell.style.background = gradeHex + '22';
      cell.style.borderColor = gradeHex + '55';
    }
    const currentPred = document.getElementById('detailCurrentPred');
    if (currentPred) currentPred.innerHTML = `${sch.predictionExcluded ? '미반영' : formatNum(valueAt(sch,year)) + '<small style="font-size:9px;font-weight:400"> 명</small>'}`;
    const wrap = document.getElementById('detailWarningWrap');
    if (wrap) wrap.innerHTML = buildWarnHtml(grade,sch,year);
    const large = document.querySelector('#detailPanel .detail-grade-large');
    if (large) { large.className = `grade-badge detail-grade-large ${GRADE_BADGE[grade]}`; large.textContent = grade; }
  }

  function pointInRing(lat,lng,ring) {
    let inside = false;
    for (let i=0,j=ring.length-1;i<ring.length;j=i++) {
      const xi=ring[i][0], yi=ring[i][1], xj=ring[j][0], yj=ring[j][1];
      if (((yi>lat)!==(yj>lat)) && (lng < (xj-xi)*(lat-yi)/(yj-yi)+xi)) inside=!inside;
    }
    return inside;
  }

  function pointInGeoJSON(lat,lng,geom) {
    if (!geom) return true;
    if (geom.type === 'Polygon') return pointInRing(lat,lng,geom.coordinates[0]);
    if (geom.type === 'MultiPolygon') return geom.coordinates.some(poly => pointInRing(lat,lng,poly[0]));
    return true;
  }

  function findDongGeom(dongNm,lat,lng) {
    const geoms = DONG_GEO[dongNm];
    if (!geoms?.length) return null;
    if (geoms.length === 1) return geoms[0];
    return geoms.find(g => pointInGeoJSON(lat,lng,g)) || geoms[0];
  }

  function makeFacMarker(lat,lng,type,name) {
    const key = `${type}|${Number(lat).toFixed(5)}|${Number(lng).toFixed(5)}`;
    if (facilityMarkerKeys.has(key)) return null;
    facilityMarkerKeys.add(key);
    const fi = FAC_ICONS[type];
    const icon = L.divIcon({
      className:'',
      html:`<div title="${String(name).replace(/"/g,'&quot;')}" style="background:#fff;border:2.5px solid ${fi.color};border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 1px 5px rgba(0,0,0,.25);">${fi.emoji}</div>`,
      iconSize:[26,26],iconAnchor:[13,13]
    });
    const m = L.marker([lat,lng],{icon,zIndexOffset:200});
    m.bindTooltip(`<b>${type}</b> ${name}`,{direction:'top',offset:[0,-10]});
    if (layerVisible.facility) m.addTo(facilityLayer);
    else facilityLayer.addLayer(m);
    return m;
  }

  function clearFacilities() {
    pendingScripts.forEach(id => document.getElementById(id)?.remove());
    pendingScripts = [];
    facilityMarkerKeys.clear();
    facilityLayer.clearLayers();
  }

  function showStaticFacilities(dongNm) {
    ['어린이','청소년','노인','장애인'].forEach(type => {
      (FAC_DATA[type] || []).forEach(f => {
        if (f[3] === dongNm) makeFacMarker(f[1],f[2],type,f[0]);
      });
    });
  }

  function vworldSearch(query,type,lat,lng,dongNm) {
    if (!VWORLD_KEY) return;
    const cbName = '_vw_' + Math.random().toString(36).slice(2);
    window[cbName] = function(data) {
      delete window[cbName];
      document.getElementById(cbName)?.remove();
      pendingScripts = pendingScripts.filter(x => x !== cbName);
      if (data.response?.status !== 'OK') return;
      const geom = findDongGeom(dongNm,lat,lng);
      (data.response.result?.items || []).forEach(item => {
        const iLat = parseFloat(item.point?.y);
        const iLng = parseFloat(item.point?.x);
        if (isNaN(iLat)||isNaN(iLng)) return;
        if (pointInGeoJSON(iLat,iLng,geom)) makeFacMarker(iLat,iLng,type,item.title);
      });
    };
    const url = `https://api.vworld.kr/req/search?service=search&request=search&version=2.0&crs=EPSG:4326&size=100&page=1&format=json&query=${encodeURIComponent(query)}&type=place&point=${lng},${lat}&radius=${RADIUS_M/1000}&key=${VWORLD_KEY}&callback=${cbName}`;
    const script = document.createElement('script');
    script.id = cbName; script.src = url;
    script.onerror = () => { delete window[cbName]; script.remove(); pendingScripts = pendingScripts.filter(x => x !== cbName); };
    pendingScripts.push(cbName);
    document.head.appendChild(script);
  }

  function loadFacilitiesForSchool(sch) {
    clearFacilities();
    if (!sch?.lat || !sch?.lng || !sch.dongNm) return;
    // 시설부족지수 산정에 사용한 676개 공급시설의 행정동 매칭 결과만 표시합니다.
    // 외부 POI 검색은 산정자료와 시설 수가 달라질 수 있어 사용하지 않습니다.
    showStaticFacilities(sch.dongNm);
  }

  window.selectSchool = function(id) {
    selectedId = id;
    const sch = schoolMap[id];
    if (sch.lat && sch.lng) leafMap.setView([sch.lat,sch.lng],14,{animate:true});
    renderList(currentYear,document.getElementById('searchInput').value);
    renderDetail(id,currentYear);
    updateMarkers(currentYear);
    loadFacilitiesForSchool(sch);

    const fab = document.getElementById('mobileDetailFab');
    if (fab) fab.classList.add('has-selection');
    if (isMobileView() && document.body.dataset.mobileView === 'list') {
      window.setMobileView('map');
    }
  };

  window.toggleLayer = function(name) {
    layerVisible[name] = !layerVisible[name];
    const map = {admin:adminLayer,hakgudo:hakgudoLayer,facility:facilityLayer};
    const btn = {admin:'btnAdmin',hakgudo:'btnHakgudo',facility:'btnFacility'};
    const layer = map[name];
    if (!layer) return;
    if (layerVisible[name]) layer.addTo(leafMap); else leafMap.removeLayer(layer);
    document.getElementById(btn[name]).classList.toggle('on',layerVisible[name]);
  };

  function computeHistData(yearIdx) {
    const cnts = new Array(7).fill(0);
    Object.values(schoolMap).forEach(s => {
      if (s.predictionExcluded) return;
      const v = s.preds?.[yearIdx];
      if (v == null) return;
      const n = Number(v);
      if (n < 10) cnts[0]++;
      else if (n < 20) cnts[1]++;
      else if (n < 30) cnts[2]++;
      else if (n < 40) cnts[3]++;
      else if (n < 50) cnts[4]++;
      else if (n < 100) cnts[5]++;
      else cnts[6]++;
    });
    return cnts;
  }

  function updateStatCards(yearIdx) {
    const d = dangerCounts[yearIdx] || 0;
    const h = highCounts[yearIdx] || 0;
    const total = Object.keys(schoolMap).length;
    document.getElementById('statDanger').textContent = d;
    document.getElementById('statHigh').textContent = h;
    document.getElementById('statSafe').textContent = total-d-h;
    document.getElementById('statTotal').textContent = total;
    document.getElementById('histYear').textContent = YEARS[yearIdx];
    if (histChartInst) { histChartInst.data.datasets[0].data = computeHistData(yearIdx); histChartInst.update('none'); }
  }

  function initStatsCharts() {
    const TICK={color:'#64748b',font:{size:10}};
    const GRID='rgba(30,45,74,.6)';
    const TIP={backgroundColor:'#1e2d4a',titleColor:'#94a3b8',bodyColor:'#e2e8f0',padding:8};
    const BINS=['0–9명','10–19명','20–29명','30–39명','40–49명','50–99명','100명+'];
    const BCLRS=['#ef4444bb','#ef4444bb','#f97316bb','#f97316bb','#22c55ebb','#22c55ebb','#22c55ebb'];

    trendChartInst = new Chart(document.getElementById('trendChart').getContext('2d'), {
      type:'line',
      data:{labels:YEARS.map(String),datasets:[
        {label:'폐교위험',data:dangerCounts,borderColor:'#ef4444',backgroundColor:'rgba(239,68,68,.1)',borderWidth:2.5,pointRadius:4,fill:true,tension:.35},
        {label:'고위험',data:highCounts,borderColor:'#f97316',backgroundColor:'rgba(249,115,22,.08)',borderWidth:2.5,pointRadius:4,fill:true,tension:.35}
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#94a3b8',font:{size:11},boxWidth:12}},tooltip:{...TIP}},scales:{x:{grid:{color:GRID},ticks:TICK},y:{grid:{color:GRID},ticks:TICK,beginAtZero:true}}}
    });

    let histYMax = 0;
    for (let i=0;i<YEARS.length;i++) histYMax = Math.max(histYMax,...computeHistData(i));
    histYMax = Math.max(10,Math.ceil(histYMax/10)*10);
    histChartInst = new Chart(document.getElementById('histChart').getContext('2d'), {
      type:'bar',
      data:{labels:BINS,datasets:[{label:'학교 수',data:computeHistData(currentYearIdx),backgroundColor:BCLRS,borderRadius:5,borderWidth:0,barPercentage:.5,categoryPercentage:.7}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{...TIP,callbacks:{label:c=>`${c.parsed.y}개 학교`}}},scales:{x:{grid:{color:GRID},ticks:{...TICK,maxRotation:30}},y:{grid:{color:GRID},ticks:TICK,beginAtZero:true,min:0,max:histYMax}}}
    });
  }

  function updateAll(yearIdx) {
    currentYearIdx = yearIdx;
    currentYear = YEARS[yearIdx];
    document.getElementById('yearDisplay').textContent = currentYear;
    document.getElementById('yearSlider').value = yearIdx;
    document.getElementById('closureNum').textContent = dangerCounts[yearIdx] || 0;
    renderList(currentYear,document.getElementById('searchInput').value);
    updateMarkers(currentYear);
    if (selectedId) updateDetailYear(currentYear);
    updateStatCards(yearIdx);
  }

  window.togglePlay = function() {
    isPlaying = !isPlaying;
    const btn = document.getElementById('playBtn');
    if (isPlaying) {
      if (currentYearIdx === YEARS.length-1) updateAll(0);
      btn.textContent='⏸'; btn.classList.add('playing');
      playTimer=setInterval(() => {
        const next=currentYearIdx+1;
        if (next >= YEARS.length) { window.togglePlay(); return; }
        updateAll(next);
        if (next === YEARS.length-1) setTimeout(() => isPlaying && window.togglePlay(), 200);
      },900);
    } else {
      btn.textContent='▶'; btn.classList.remove('playing'); clearInterval(playTimer);
    }
  };

  document.getElementById('yearSlider').max = YEARS.length-1;
  document.getElementById('yearSlider').value = currentYearIdx;
  document.getElementById('sliderTicks').innerHTML = YEARS.map(y => `<span>${y}</span>`).join('');
  document.getElementById('trendYears').textContent = `${YEARS[0]}–${YEARS[YEARS.length-1]}`;

  document.getElementById('yearSlider').addEventListener('input', e => {
    if (isPlaying) window.togglePlay();
    updateAll(parseInt(e.target.value));
  });
  document.getElementById('searchInput').addEventListener('input', e => renderList(currentYear,e.target.value));

  initMap();
  initStatsCharts();
  updateAll(currentYearIdx);
  syncResponsiveMode();

  if (MOBILE_MQ.addEventListener) MOBILE_MQ.addEventListener('change', syncResponsiveMode);
  else if (MOBILE_MQ.addListener) MOBILE_MQ.addListener(syncResponsiveMode);
  window.addEventListener('orientationchange', () => setTimeout(syncResponsiveMode, 120));
  window.addEventListener('resize', () => {
    if (isMobileView() && document.body.dataset.mobileView === 'map') {
      setTimeout(() => leafMap && leafMap.invalidateSize(), 80);
    }
  });
})();

</script>

<script>
(function(){
  function showRuntimeError(msg){
    var box=document.getElementById('mobileRuntimeError');
    var code=document.getElementById('mobileRuntimeErrorCode');
    if(box){ box.style.display='flex'; }
    if(code){ code.textContent=msg || 'Leaflet / Chart.js load failed'; }
  }
  window.addEventListener('error', function(e){
    if(/\b(L|Chart)\b|Leaflet|Chart/i.test(String(e.message||''))) showRuntimeError(String(e.message||'Runtime error'));
  });
  window.addEventListener('DOMContentLoaded', function(){
    if(typeof window.L==='undefined' || typeof window.Chart==='undefined'){
      showRuntimeError('Leaflet='+(typeof window.L)+', Chart='+(typeof window.Chart)+', protocol='+location.protocol);
    }
  });
})();
</script>
